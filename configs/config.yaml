# config.yaml
defaults:
  - stage: edge
  - _self_
debug: true

# --- pipeline mode: ``python -m intelligent_pipeline pipeline=<name>`` ---
# When ``pipeline`` is set the pipeline runner (runner.py) takes over instead of
# the single-stage mode. Run-level knobs below (CLI-overridable) drive it; the
# step definitions live in configs/pipelines/<name>.yaml.
pipeline: null        # pipeline name (configs/pipelines/<name>.yaml); null = stage mode
executor: null        # local | slurm | ray  (null = use the pipeline YAML's executor)
metrics: null         # subset of eval stages to run (null = all); e.g. "lpips,ssim"
interpreter: null     # default interpreter for steps that omit one (else current python)

# Shared per-item context. Every stage reads from here. ``output_dir`` is the
# unit of work (one recorded scenario); the rest are derived from it. A pipeline
# batch is a list of these ``output_dir`` values.
run:
  output_dir: /tmp/cosmos_transfer/run
  # Micro-batch hint forwarded to a step's stage (run.batch_size) when the step sets
  # a batch_size. Stages that ignore it treat it as a no-op; inference today
  # generates one sample at a time (cosmos enforces unique sample names).
  batch_size: null
  rgb_input: ${run.output_dir}/sensor_recordings/front_rgb/front_rgb.mp4
  semantic_input: ${run.output_dir}/sensor_recordings/front_semantic_cityscapes/front_semantic_cityscapes.mp4
  depth_input: ${run.output_dir}/sensor_recordings/front_depth_log/front_depth_log.mp4
  raw_semantic: ${run.output_dir}/sensor_recordings/front_semantic_id/raw_frames.npy
  prompt_output: ${run.output_dir}/prompt.txt
  seg_mask_output: ${run.output_dir}/seg_mask.mp4
  edge_mask_output: ${run.output_dir}/edge_mask.mp4
  edge_output: ${run.output_dir}/edge.mp4
  generation_config: ${run.output_dir}/generation_config.json
  generated_video: ${run.output_dir}/guided_generation.mp4
  results_file: ${run.output_dir}/results.json
  # --- evaluation inputs / outputs (defaults match the original) ---
  # clipqa_video is a single video; the user decides whether it is the
  # generated video or the original RGB.
  lpips_pred: ${run.output_dir}/sensor_recordings/front_rgb/front_rgb.mp4
  lpips_true: ${run.output_dir}/guided_generation.mp4
  clipqa_video: ${run.output_dir}/guided_generation.mp4
  ssim_pred: ${run.output_dir}/sensor_recordings/front_rgb/front_rgb.mp4
  ssim_true: ${run.output_dir}/guided_generation.mp4
  iou_cosmos: ${run.output_dir}/guided_generation.mp4
  iou_raw: ${run.output_dir}/sensor_recordings/front_rgb/front_rgb.mp4
  iou_cosmos_seg: ${run.output_dir}/yolo_seg_cosmos.mp4
  iou_raw_seg: ${run.output_dir}/yolo_seg.npy
  iou_raw_values: ${run.output_dir}/semantic_iou_raw.npy
  iou_temporal_rgb: ${run.output_dir}/guided_generation.mp4
  iou_temporal_flow_video: ${run.output_dir}/yolo_segmentation_eval_temporal.mp4
  iou_temporal_flow_raw: ${run.output_dir}/temporal_iou_raw.npy

# Batch source for the (batch) inference stage. Provide ONE of:
#   dirs     - an explicit list of output dirs
#   manifest - a file with one output dir per line
#   glob     - a glob pattern matching the output dirs
# The pipeline runner sets this; defaults to the single run.output_dir.
batch:
  dirs: null
  manifest: null
  glob: null

# Keep the working directory as the invocation directory. Stages run as
# subprocesses (via the executors) and may import/run code relative to a repo,
# so we do not want hydra to chdir into outputs/<timestamp>.
hydra:
  job:
    chdir: false
